[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livecap"
version = "0.5.1"
description = "Real-time speech translation captions for macOS"
authors = [{ name = "Pyeongwoo Lee", email = "dennis2.lee@gmail.com" }]
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "google-genai>=1.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "soxr>=0.5",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
livecap = "livecap.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
